name: R4 learning proposals

on:
  push:
    branches: [developer, main]
  pull_request:
    branches: [developer, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learning-proposals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert checked-out SHA
        shell: bash
        run: |
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: Compile backend
        working-directory: backend
        run: python -m compileall .
      - name: Smoke import learning and profiles routes
        working-directory: backend
        run: python -c "import application.learning.proposals; import application.profiles.patch_service; import routes.profiles; print('R4 learning imports PASSED')"
      - name: Run R4 learning proposal tests
        working-directory: backend
        run: python -m pytest -q tests/test_r4_learning_proposals.py
