name: R4 root-cause regression

on:
  push:
    branches: [r4-root-cause-fix-61bf7f]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_DEFAULT_LANGUAGE: es
      LANGUAGE_MIN_CONFIDENCE: "0.6"
      LANGUAGE_MIN_MARGIN: "0.2"
      PRODAGENTIC_AUTH_ENABLED: "false"
      MK1_ENABLED: "true"
      MK1_PROFILE_V2: "true"
      MK1_BATCH_PLANNING: "true"
      MK1_STRUCTURED_AGENT_CELL: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bind evidence to exact SHA
        run: |
          echo "candidate_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked and test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: Compile changed production modules
        working-directory: backend
        run: python -m py_compile routes/production.py core/validator.py
      - name: Run exact root-cause regressions
        working-directory: backend
        run: |
          python -m pytest -q \
            tests/test_language_validator.py \
            tests/test_r4_router_isolation.py \
            tests/test_model_router.py \
            tests/test_language_recovery.py

  backend-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_DEFAULT_LANGUAGE: es
      LANGUAGE_MIN_CONFIDENCE: "0.6"
      LANGUAGE_MIN_MARGIN: "0.2"
      IMAGE_RENDER_ENABLED: "true"
      PRODAGENTIC_AUTH_ENABLED: "false"
      PRODAGENTIC_DEPLOYMENT_KEY: r4-root-cause-regression
      MK1_ENABLED: "true"
      MK1_PROFILE_V2: "true"
      MK1_BATCH_PLANNING: "true"
      MK1_STRUCTURED_AGENT_CELL: "true"
      MONGO_URI: mongodb://127.0.0.1:27017
      MONGO_TEST_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bind evidence to exact SHA
        run: |
          echo "candidate_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked and test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: Compile backend
        working-directory: backend
        run: python -m compileall .
      - name: Run complete backend suite
        working-directory: backend
        run: python -m pytest -q
