name: R4 full historical regression

on:
  push:
    branches: [main, developer]
  pull_request:
    branches: [main, developer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_DEFAULT_LANGUAGE: es
      LANGUAGE_MIN_CONFIDENCE: "0.6"
      LANGUAGE_MIN_MARGIN: "0.2"
      IMAGE_RENDER_ENABLED: "true"
      PRODAGENTIC_AUTH_ENABLED: "false"
      PRODAGENTIC_DEPLOYMENT_KEY: r4-full-regression
      MK1_ENABLED: "true"
      MK1_PROFILE_V2: "true"
      MK1_BATCH_PLANNING: "true"
      MONGO_URI: mongodb://127.0.0.1:27018
      MONGO_TEST_URI: mongodb://127.0.0.1:27017
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert checked-out SHA
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: Compile all backend Python
        working-directory: backend
        run: python -m compileall .
      - name: Run complete backend regression with durable evidence
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          set +e
          python -m pytest -q --junitxml=backend-full-junit.xml 2>&1 | tee backend-full.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > backend-full-exit-code.txt
          {
            echo "candidate_sha=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "workflow_run_id=${{ github.run_id }}"
            echo "workflow_run_attempt=${{ github.run_attempt }}"
            echo "pytest_exit_code=$status"
          } > backend-full-metadata.txt
      - name: Upload backend full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-backend-full-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/backend-full-junit.xml
            backend/backend-full.log
            backend/backend-full-exit-code.txt
            backend/backend-full-metadata.txt
          if-no-files-found: error
          retention-days: 30
      - name: Enforce backend regression result
        if: always()
        working-directory: backend
        run: |
          test -f backend-full-exit-code.txt
          status="$(cat backend-full-exit-code.txt)"
          test "$status" = "0"

  frontend-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert checked-out SHA
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Run frontend unit regression
        working-directory: frontend
        run: npm test -- --ci
      - name: Build production frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_MK1_MANUAL_EXPORT: "true"
        run: npm run build
      - name: Verify renderer JavaScript parses
        run: node --check renderer/src/server.mjs
      - name: Verify compose contract parses
        run: docker compose config --quiet
