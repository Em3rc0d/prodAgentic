name: R4 real-provider stop diagnostic

on:
  push:
    branches: [r4-real-uat-cert-61bf7f]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-provider-stop-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: 61bf7f93b37b00f3315c3f710d8005fed977e672
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PRODAGENTIC_DEMO_MODE: "false"
      R4_WEB_URL: https://localhost:3000
      R4_API_URL: https://localhost:8000
      COMPOSE_PROJECT_NAME: prodagentic-r4-stop-diagnostic
      R4_EVIDENCE_DIR: /tmp/r4-evidence

    steps:
      - name: Initialize immutable evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$R4_EVIDENCE_DIR"
          printf 'workflow_sha=%s\ntarget_sha=%s\nrun_id=%s\nrun_attempt=%s\nmode=production_non_demo\n' \
            "$GITHUB_SHA" "$TARGET_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$R4_EVIDENCE_DIR/metadata.txt"

      - name: Require real provider secret
        run: test -n "${GEMINI_API_KEY:-}"

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Assert candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'checked_out_sha=%s\n' "$actual" >> "$R4_EVIDENCE_DIR/metadata.txt"
          test "$actual" = "$TARGET_SHA"

      - name: Create masked ephemeral production auth secrets
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          session_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "::add-mask::$session_secret"
          echo "PRODAGENTIC_ADMIN_USER=em3rc0d-diagnostic" >> "$GITHUB_ENV"
          echo "PRODAGENTIC_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "PRODAGENTIC_SESSION_SECRET=$session_secret" >> "$GITHUB_ENV"

      - name: Start strict production-like non-demo stack
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.local-production.yml up --build -d --wait --wait-timeout 600

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Write phase-aware runtime diagnostic spec
        shell: bash
        run: |
          cat > frontend/e2e/.r4-real-stop.runtime.spec.ts <<'TS'
          import { expect, test } from "@playwright/test";
          import { appendFileSync, mkdirSync, writeFileSync } from "node:fs";
          import { join } from "node:path";

          test.use({ ignoreHTTPSErrors: true });
          const WEB = process.env.R4_WEB_URL || "https://localhost:3000";
          const API = process.env.R4_API_URL || "https://localhost:8000";
          const username = process.env.PRODAGENTIC_ADMIN_USER || "";
          const password = process.env.PRODAGENTIC_ADMIN_PASSWORD || "";
          const targetSha = process.env.TARGET_SHA || "unknown";
          const evidenceDir = process.env.R4_EVIDENCE_DIR || "/tmp/r4-evidence";
          mkdirSync(evidenceDir, { recursive: true });

          type SafePhase = "BATCH" | "READINESS" | "PRODUCE_TEXT" | "OTHER";
          function phaseFor(url: string): SafePhase {
            if (/\/api\/profiles\/[^/]+\/batches(?:\?|$)/.test(url)) return "BATCH";
            if (url.includes("runtime-readiness")) return "READINESS";
            if (url.includes("/produce-text")) return "PRODUCE_TEXT";
            return "OTHER";
          }
          function safeStopCode(detail: string): string {
            if (detail.includes("Research verdict NO_GO")) return "RESEARCH_NO_GO";
            if (detail.includes("Editor verdict REJECT")) return "EDITOR_REJECTED";
            if (detail.toLowerCase().includes("revision budget")) return "REVISION_BUDGET_EXHAUSTED";
            return "PRODUCTION_DOMAIN_STOP";
          }
          function record(name: string, value: unknown) {
            appendFileSync(join(evidenceDir, name), `${JSON.stringify(value)}\n`, "utf8");
          }

          const setup = {
            name: "EM3RC0D R4 REAL DIAGNOSTIC",
            account_type: "education",
            goals: ["educate", "build_authority"],
            audience: "students and junior professionals in systems engineering, computing and IT who want practical technical skills",
            voice: ["technical", "direct"],
            batch_size: 4,
            channels: ["manual_export"],
            examples: [{
              kind: "caption",
              label: "EM3RC0D technical authority",
              text: "Explica problemas reales de sistemas, software, datos, redes, cloud y arquitectura con ejemplos concretos, sin repetir el mismo tutorial ni el mismo ángulo.",
            }],
          };

          test("capture the first failing real-provider phase without leaking content", async ({ page }) => {
            test.setTimeout(420_000);
            writeFileSync(join(evidenceDir, "network.jsonl"), "", "utf8");
            writeFileSync(join(evidenceDir, "produce-text.jsonl"), "", "utf8");
            const captureTasks: Promise<void>[] = [];
            let finishSignal: ((value: string) => void) | null = null;
            const terminal = new Promise<string>((resolve) => { finishSignal = resolve; });

            page.on("request", (request) => {
              const phase = phaseFor(request.url());
              if (phase === "OTHER") return;
              record("network.jsonl", { target_sha: targetSha, event: "request", phase, method: request.method() });
            });

            page.on("response", (response) => {
              const phase = phaseFor(response.url());
              if (phase === "OTHER") return;
              const task = (async () => {
                const status = response.status();
                record("network.jsonl", { target_sha: targetSha, event: "response", phase, status });
                if (phase === "BATCH" && status >= 400) finishSignal?.(`BATCH_HTTP_${status}`);
                if (phase === "READINESS") {
                  let state = "UNKNOWN";
                  try {
                    const parsed = JSON.parse(await response.text());
                    state = typeof parsed?.state === "string" ? parsed.state : "UNKNOWN";
                  } catch {}
                  record("network.jsonl", { target_sha: targetSha, event: "readiness_state", state });
                  if (state !== "READY") finishSignal?.(`READINESS_${state}`);
                }
                if (phase === "PRODUCE_TEXT") {
                  let detail = "";
                  try {
                    const parsed = JSON.parse(await response.text());
                    detail = typeof parsed?.detail === "string" ? parsed.detail : "";
                  } catch {}
                  const stopCode = status === 422 ? safeStopCode(detail) : "NONE";
                  record("produce-text.jsonl", { target_sha: targetSha, status, stop_code: stopCode });
                  finishSignal?.(`PRODUCE_TEXT_${status}_${stopCode}`);
                }
              })();
              captureTasks.push(task);
            });

            const login = await page.request.post(`${API}/api/auth/login`, {
              ignoreHTTPSErrors: true,
              data: { username, password },
            });
            expect(login.ok()).toBeTruthy();
            const session = await login.json();
            const headers = { "X-CSRF-Token": String(session.csrf_token) };

            const proposalResponse = await page.request.post(`${API}/api/profiles/inference-proposals`, {
              ignoreHTTPSErrors: true,
              headers,
              data: setup,
            });
            expect(proposalResponse.ok()).toBeTruthy();
            const proposal = await proposalResponse.json();

            const acceptanceResponse = await page.request.post(`${API}/api/profiles`, {
              ignoreHTTPSErrors: true,
              headers,
              data: { setup, proposal_digest: proposal.proposal_digest },
            });
            expect(acceptanceResponse.ok()).toBeTruthy();

            await page.goto(`${WEB}/create`, { waitUntil: "domcontentloaded" });
            await expect(page.getByRole("heading", { name: "Create for EM3RC0D R4 REAL DIAGNOSTIC" })).toBeVisible({ timeout: 60_000 });
            await page.getByRole("button", { name: "Generate next batch" }).click();

            const reviewSignal = page.waitForURL(/\/review$/, { timeout: 360_000 }).then(() => "REVIEW_REACHED").catch(() => "NO_REVIEW");
            const alertSignal = page.getByRole("alert").waitFor({ state: "visible", timeout: 360_000 }).then(async () => {
              const text = (await page.getByRole("alert").innerText()).trim();
              const match = text.match(/(?:failed|unavailable|Batch planning failed:)\s*:?[ ]*(\d{3})?/i);
              return match?.[1] ? `UI_ALERT_HTTP_${match[1]}` : "UI_ALERT_PRESENT";
            }).catch(() => "NO_ALERT");
            const gateSignal = page.getByText("Production is paused truthfully.").waitFor({ state: "visible", timeout: 360_000 }).then(() => "PRODUCTION_GATE_PRESENT").catch(() => "NO_GATE");
            const timeoutSignal = new Promise<string>((resolve) => setTimeout(() => resolve("DIAGNOSTIC_TIMEOUT"), 360_000));

            const signal = await Promise.race([terminal, reviewSignal, alertSignal, gateSignal, timeoutSignal]);
            await Promise.allSettled(captureTasks);
            const cardStates = await page.locator("[data-production-state]").evaluateAll((nodes) => nodes.map((node) => node.getAttribute("data-production-state") || "UNKNOWN")).catch(() => [] as string[]);
            const counts = cardStates.reduce<Record<string, number>>((acc, state) => { acc[state] = (acc[state] || 0) + 1; return acc; }, {});
            writeFileSync(join(evidenceDir, "terminal.json"), JSON.stringify({ target_sha: targetSha, signal, url_path: new URL(page.url()).pathname, production_state_counts: counts }, null, 2), "utf8");

            // Diagnostic runs are evidence collectors, never certification gates.
            // A captured stop is considered a successful diagnostic observation;
            // promotion remains fail-closed in the workflow's final step.
            expect(signal).not.toBe("DIAGNOSTIC_TIMEOUT");
          });
          TS

      - name: Run real-provider phase diagnostic
        id: real_uat
        continue-on-error: true
        working-directory: frontend
        run: npx playwright test e2e/.r4-real-stop.runtime.spec.ts --reporter=line

      - name: Persist sanitized stack evidence
        if: always()
        shell: bash
        run: |
          set +e
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.local-production.yml logs --no-color 2>&1 \
            | grep -E 'R4 production domain stop code=' > "$R4_EVIDENCE_DIR/domain-stop.log"
          printf 'playwright_outcome=%s\n' '${{ steps.real_uat.outcome }}' >> "$R4_EVIDENCE_DIR/metadata.txt"

      - name: Destroy isolated stack
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.local-production.yml down -v --remove-orphans || true

      - name: Upload immutable sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-phase-diagnostic-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: ${{ env.R4_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Fail closed because diagnostic evidence cannot certify R4
        if: always()
        shell: bash
        run: |
          echo "Diagnostic-only workflow: evidence persisted; certification intentionally blocked."
          exit 1
