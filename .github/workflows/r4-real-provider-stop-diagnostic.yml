name: R4 real-provider stop diagnostic

on:
  push:
    branches: [r4-real-uat-cert-61bf7f]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-provider-stop-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: 61bf7f93b37b00f3315c3f710d8005fed977e672
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PRODAGENTIC_DEMO_MODE: "false"
      R4_API_URL: https://localhost:8000
      COMPOSE_PROJECT_NAME: prodagentic-r4-stop-diagnostic
      R4_EVIDENCE_DIR: /tmp/r4-evidence

    steps:
      - name: Initialize immutable evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$R4_EVIDENCE_DIR"
          printf 'workflow_sha=%s\ntarget_sha=%s\nrun_id=%s\nrun_attempt=%s\nmode=production_non_demo\ndiagnostic=direct_api_authority_plus_safe_lineage\n' \
            "$GITHUB_SHA" "$TARGET_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$R4_EVIDENCE_DIR/metadata.txt"

      - name: Require real provider secret
        run: test -n "${GEMINI_API_KEY:-}"

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Assert candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'checked_out_sha=%s\n' "$actual" >> "$R4_EVIDENCE_DIR/metadata.txt"
          test "$actual" = "$TARGET_SHA"

      - name: Create masked ephemeral production auth secrets
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          session_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "::add-mask::$session_secret"
          echo "PRODAGENTIC_ADMIN_USER=em3rc0d-diagnostic" >> "$GITHUB_ENV"
          echo "PRODAGENTIC_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "PRODAGENTIC_SESSION_SECRET=$session_secret" >> "$GITHUB_ENV"

      - name: Start strict production-like non-demo stack
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.local-production.yml up --build -d --wait --wait-timeout 600

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install diagnostic dependencies
        working-directory: frontend
        run: npm ci

      - name: Write direct API authority diagnostic
        shell: bash
        run: |
          cat > frontend/e2e/.r4-real-stop.api.spec.ts <<'TS'
          import { expect, request, test } from "@playwright/test";
          import { appendFileSync, mkdirSync, writeFileSync } from "node:fs";
          import { join } from "node:path";

          const API = process.env.R4_API_URL || "https://localhost:8000";
          const username = process.env.PRODAGENTIC_ADMIN_USER || "";
          const password = process.env.PRODAGENTIC_ADMIN_PASSWORD || "";
          const targetSha = process.env.TARGET_SHA || "unknown";
          const evidenceDir = process.env.R4_EVIDENCE_DIR || "/tmp/r4-evidence";
          mkdirSync(evidenceDir, { recursive: true });

          function record(value: Record<string, unknown>) {
            appendFileSync(join(evidenceDir, "api-phases.jsonl"), `${JSON.stringify({ target_sha: targetSha, ...value })}\n`, "utf8");
          }

          function stopCode(detail: string): string {
            if (detail.includes("Research verdict NO_GO")) return "RESEARCH_NO_GO";
            if (detail.includes("Editor verdict REJECT")) return "EDITOR_REJECTED";
            if (detail.toLowerCase().includes("revision budget")) return "REVISION_BUDGET_EXHAUSTED";
            return "PRODUCTION_DOMAIN_STOP";
          }

          async function safeJson(response: { json(): Promise<unknown> }): Promise<any> {
            try { return await response.json(); } catch { return null; }
          }

          async function phase<T>(name: string, fn: () => Promise<T>): Promise<{ value: T; elapsed_ms: number }> {
            const started = Date.now();
            const value = await fn();
            const elapsed_ms = Date.now() - started;
            record({ phase: name, event: "completed", elapsed_ms });
            return { value, elapsed_ms };
          }

          const setup = {
            name: "EM3RC0D R4 REAL DIAGNOSTIC",
            account_type: "education",
            goals: ["educate", "build_authority"],
            audience: "students and junior professionals in systems engineering, computing and IT who want practical technical skills",
            voice: ["technical", "direct"],
            batch_size: 4,
            channels: ["manual_export"],
            examples: [{
              kind: "caption",
              label: "EM3RC0D technical authority",
              text: "Explica problemas reales de sistemas, software, datos, redes, cloud y arquitectura con ejemplos concretos, sin repetir el mismo tutorial ni el mismo ángulo.",
            }],
          };

          test("isolate exact real-provider production stop at API authority boundary", async () => {
            test.setTimeout(1_500_000);
            writeFileSync(join(evidenceDir, "api-phases.jsonl"), "", "utf8");
            writeFileSync(join(evidenceDir, "produce-text.jsonl"), "", "utf8");

            const api = await request.newContext({
              baseURL: API,
              ignoreHTTPSErrors: true,
              extraHTTPHeaders: { "Content-Type": "application/json" },
            });

            try {
              const ready = await phase("READINESS", () => api.get("/health/ready"));
              record({ phase: "READINESS", status: ready.value.status(), ready: ready.value.ok(), elapsed_ms: ready.elapsed_ms });
              expect(ready.value.ok()).toBeTruthy();

              const login = await phase("LOGIN", () => api.post("/api/auth/login", { data: { username, password } }));
              record({ phase: "LOGIN", status: login.value.status(), ok: login.value.ok(), elapsed_ms: login.elapsed_ms });
              expect(login.value.ok()).toBeTruthy();
              const session = await safeJson(login.value);
              const csrf = typeof session?.csrf_token === "string" ? session.csrf_token : "";
              expect(csrf.length).toBeGreaterThan(0);
              const headers = { "X-CSRF-Token": csrf };

              const proposal = await phase("PROFILE_PROPOSAL", () => api.post("/api/profiles/inference-proposals", { headers, data: setup }));
              record({ phase: "PROFILE_PROPOSAL", status: proposal.value.status(), ok: proposal.value.ok(), elapsed_ms: proposal.elapsed_ms });
              expect(proposal.value.ok()).toBeTruthy();
              const proposalBody = await safeJson(proposal.value);
              const proposalDigest = typeof proposalBody?.proposal_digest === "string" ? proposalBody.proposal_digest : "";
              expect(proposalDigest).toMatch(/^[0-9a-f]{64}$/);

              const acceptance = await phase("PROFILE_ACCEPTANCE", () => api.post("/api/profiles", { headers, data: { setup, proposal_digest: proposalDigest } }));
              record({ phase: "PROFILE_ACCEPTANCE", status: acceptance.value.status(), ok: acceptance.value.ok(), elapsed_ms: acceptance.elapsed_ms });
              expect(acceptance.value.ok()).toBeTruthy();
              const acceptanceBody = await safeJson(acceptance.value);
              const profileId = typeof acceptanceBody?.profile?.profile_id === "string" ? acceptanceBody.profile.profile_id : "";
              expect(profileId.length).toBeGreaterThan(0);

              const start = new Date();
              start.setUTCDate(start.getUTCDate() + 1);
              start.setUTCHours(0, 0, 0, 0);
              const end = new Date(start);
              end.setUTCDate(end.getUTCDate() + 1);
              const batchPayload = {
                target_window: { start_at: start.toISOString(), end_at: end.toISOString(), timezone: "UTC" },
                requested_size: 4,
                constraints: { campaign_goal: null, include_topics: [], avoid_topics: [], desired_format: null },
              };

              const batch = await phase("BATCH", () => api.post(`/api/profiles/${encodeURIComponent(profileId)}/batches`, { headers, data: batchPayload, timeout: 300_000 }));
              const batchBody = await safeJson(batch.value);
              const contentItems = Array.isArray(batchBody?.content_items) ? batchBody.content_items : [];
              record({
                phase: "BATCH",
                status: batch.value.status(),
                ok: batch.value.ok(),
                elapsed_ms: batch.elapsed_ms,
                creative_source: typeof batchBody?.creative_source === "string" ? batchBody.creative_source : null,
                completeness_policy: typeof batchBody?.completeness_policy === "string" ? batchBody.completeness_policy : null,
                content_count: contentItems.length,
              });
              if (!batch.value.ok()) {
                writeFileSync(join(evidenceDir, "terminal.json"), JSON.stringify({ target_sha: targetSha, terminal_phase: "BATCH", status: batch.value.status() }, null, 2));
                return;
              }
              expect(batchBody?.creative_source).toBe("model_router");
              expect(contentItems).toHaveLength(4);

              const results: Array<Record<string, unknown>> = [];
              for (let index = 0; index < contentItems.length; index += 1) {
                const contentId = typeof contentItems[index]?.content_id === "string" ? contentItems[index].content_id : "";
                expect(contentId.length).toBeGreaterThan(0);
                const produced = await phase(`PRODUCE_TEXT_${index + 1}`, () => api.post(`/api/content-items/${encodeURIComponent(contentId)}/produce-text`, { headers, data: { parent_revision_id: null }, timeout: 360_000 }));
                const body = await safeJson(produced.value);
                const detail = typeof body?.detail === "string" ? body.detail : "";
                const code = produced.value.status() === 422 ? stopCode(detail) : "NONE";
                const row = { ordinal: index + 1, content_id: contentId, status: produced.value.status(), ok: produced.value.ok(), stop_code: code, elapsed_ms: produced.elapsed_ms };
                results.push(row);
                appendFileSync(join(evidenceDir, "produce-text.jsonl"), `${JSON.stringify({ target_sha: targetSha, ...row })}\n`, "utf8");
              }

              const statusCounts = results.reduce<Record<string, number>>((acc, row) => {
                const key = String(row.status);
                acc[key] = (acc[key] || 0) + 1;
                return acc;
              }, {});
              const stopCounts = results.reduce<Record<string, number>>((acc, row) => {
                const key = String(row.stop_code);
                acc[key] = (acc[key] || 0) + 1;
                return acc;
              }, {});
              writeFileSync(join(evidenceDir, "terminal.json"), JSON.stringify({
                target_sha: targetSha,
                terminal_phase: "PRODUCE_TEXT",
                content_count: contentItems.length,
                status_counts: statusCounts,
                stop_code_counts: stopCounts,
              }, null, 2));
            } finally {
              await api.dispose();
            }
          });
          TS

      - name: Run direct real-provider API diagnostic
        id: api_diagnostic
        continue-on-error: true
        working-directory: frontend
        run: npx playwright test e2e/.r4-real-stop.api.spec.ts --reporter=line

      - name: Persist sanitized Mongo failure lineage
        if: always()
        shell: bash
        run: |
          set +e
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.local-production.yml exec -T mongo \
            mongosh --quiet prodagentic_local --eval '
              const runs = db.generation_runs.find({}, {
                _id: 0,
                tenant_id: 0,
                profile_id: 0,
                profile_snapshot_digest: 0,
                plan_id: 0,
                plan_digest: 0,
                contract_versions: 0,
                research_pack_ref: 0,
                content_spec_ref: 0,
                editorial_review_ref: 0,
                visual_spec_ref: 0,
                qa_report_refs: 0
              }).sort({started_at: 1}).toArray();
              for (const run of runs) {
                const attempts = db.agent_run_attempts.find({run_id: run.run_id}, {
                  _id: 0,
                  tenant_id: 0,
                  run_id: 0,
                  input_digest: 0,
                  output_digest: 0
                }).sort({created_at: 1, attempt: 1}).toArray();
                const safeRun = {
                  run_id: run.run_id,
                  content_id: run.content_id,
                  state: run.state,
                  failure: run.failure ? {
                    code: run.failure.code,
                    stage: run.failure.stage,
                    retryable: run.failure.retryable,
                    safe_message: run.failure.safe_message
                  } : null,
                  started_at: run.started_at,
                  completed_at: run.completed_at,
                  attempts: attempts.map((a) => ({
                    agent_run_id: a.agent_run_id,
                    agent: a.agent,
                    contract_version: a.contract_version,
                    prompt_version: a.prompt_version,
                    provider: a.provider,
                    model: a.model,
                    attempt: a.attempt,
                    latency_ms: a.latency_ms,
                    status: a.status,
                    safe_failure_code: a.safe_failure_code,
                    created_at: a.created_at
                  }))
                };
                print(EJSON.stringify(safeRun));
              }
            ' > "$R4_EVIDENCE_DIR/safe-lineage.jsonl" 2> "$R4_EVIDENCE_DIR/safe-lineage.stderr" || true
          test -s "$R4_EVIDENCE_DIR/safe-lineage.jsonl" || printf 'NO_LINEAGE_ROWS\n' > "$R4_EVIDENCE_DIR/safe-lineage.jsonl"

      - name: Persist sanitized stack evidence
        if: always()
        shell: bash
        run: |
          set +e
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.local-production.yml logs --no-color 2>&1 \
            | grep -E 'R4 production domain stop code=' > "$R4_EVIDENCE_DIR/domain-stop.log"
          printf 'api_diagnostic_outcome=%s\n' '${{ steps.api_diagnostic.outcome }}' >> "$R4_EVIDENCE_DIR/metadata.txt"

      - name: Destroy isolated stack
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.local-production.yml down -v --remove-orphans || true

      - name: Upload immutable sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-api-lineage-${{ env.TARGET_SHA }}-${{ github.run_id }}
          path: ${{ env.R4_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Fail closed because diagnostic evidence cannot certify R4
        if: always()
        shell: bash
        run: |
          echo "Diagnostic-only workflow: evidence persisted; certification intentionally blocked."
          exit 1
