name: SECURITY-PATCH lock regeneration

on:
  push:
    branches:
      - security/next-16.3.3

permissions:
  contents: write

jobs:
  regenerate-lock:
    if: ${{ !contains(github.event.head_commit.message, '[lock-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/next-16.3.3

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate npm lock from pinned manifest
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify patched pins
        working-directory: frontend
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies.next!=='16.3.3'||p.devDependencies['eslint-config-next']!=='16.3.3') process.exit(1)"
          node -e "const l=require('./package-lock.json'); const r=l.packages['']; if(r.dependencies.next!=='16.3.3'||r.devDependencies['eslint-config-next']!=='16.3.3') process.exit(1)"

      - name: Commit regenerated lock
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lock already current"
            exit 0
          fi
          git commit -m "SECURITY-PATCH-2026-08: regenerate npm lock [lock-generated]"
          git push origin HEAD:security/next-16.3.3
