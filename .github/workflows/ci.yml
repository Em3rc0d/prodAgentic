name: CI

on:
  push:
    branches: [ main, feat/model-registry-router, feat/content-intelligence-foundation, feat/docker-one-command-stack ]
  pull_request:
    branches: [ main, feat/release-e2e-certification ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_DEFAULT_LANGUAGE: es
      APP_WORKSPACE_ID: ci-workspace
      LANGUAGE_MIN_CONFIDENCE: "0.6"
      LANGUAGE_MIN_MARGIN: "0.2"
      IMAGE_RENDER_ENABLED: "true"
      PRODAGENTIC_AUTH_ENABLED: "false"
      MONGO_URI: mongodb://127.0.0.1:27018
      MONGO_TEST_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Smoke import test
        working-directory: backend
        run: |
          python -c "import agents.router; import agents.orchestrator; import main; print('Smoke test PASSED')"
      - name: Compile check
        working-directory: backend
        run: python -m compileall .
      - name: Run Backend Tests
        working-directory: backend
        run: python -m pytest -q

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Frontend Lint
        working-directory: frontend
        run: npm run lint
      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test
      - name: Build Frontend
        working-directory: frontend
        run: npm run build

  docker-stack-test:
    runs-on: ubuntu-latest
    env:
      SCHEDULER_ENABLED: "false"
      PRODAGENTIC_PORT: "8080"
    steps:
      - uses: actions/checkout@v4
      - name: Create CI-only backend environment
        run: |
          cat > backend/.env <<'EOF'
          GEMINI_API_KEY=docker-ci-placeholder
          APP_DEFAULT_LANGUAGE=es
          APP_WORKSPACE_ID=docker-ci-workspace
          IMAGE_RENDER_ENABLED=false
          PRODAGENTIC_AUTH_ENABLED=true
          PRODAGENTIC_ADMIN_USER=admin
          PRODAGENTIC_ADMIN_PASSWORD=docker-ci-password
          PRODAGENTIC_SESSION_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef
          PRODAGENTIC_SESSION_TTL_SECONDS=43200
          EOF
      - name: Validate Compose contract
        run: docker compose config --quiet
      - name: Build and start complete stack
        run: docker compose up --build -d --wait --wait-timeout 240
      - name: Verify single public gateway
        run: |
          curl -fsS http://127.0.0.1:8080/health/live
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          if curl -fsS http://127.0.0.1:8080/openapi.json; then
            echo "openapi.json must not be publicly exposed"
            exit 1
          fi
      - name: Capture stack state
        if: always()
        run: docker compose ps && docker compose logs --no-color --tail=150
      - name: Tear down stack
        if: always()
        run: docker compose down -v --remove-orphans
