name: CI

on:
  push:
    branches: [ main, feat/model-registry-router, reconcile/commercial-v1-main-first ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_DEFAULT_LANGUAGE: es
      APP_WORKSPACE_ID: ci-workspace
      LANGUAGE_MIN_CONFIDENCE: "0.6"
      LANGUAGE_MIN_MARGIN: "0.2"
      IMAGE_RENDER_ENABLED: "true"
      PRODAGENTIC_AUTH_ENABLED: "false"
      MONGO_URI: mongodb://127.0.0.1:27018
      MONGO_TEST_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Locked Production Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
      - name: Install Test Dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Audit Locked Production Dependencies
        working-directory: backend
        run: |
          python -m venv /tmp/prodagentic-pip-audit
          /tmp/prodagentic-pip-audit/bin/python -m pip install --upgrade pip
          /tmp/prodagentic-pip-audit/bin/python -m pip install pip-audit==2.10.1
          /tmp/prodagentic-pip-audit/bin/pip-audit --require-hashes -r requirements.lock
      - name: Smoke import test
        working-directory: backend
        run: |
          python -c "import agents.router; import agents.orchestrator; import main; print('Smoke test PASSED')"
      - name: Compile check
        working-directory: backend
        run: python -m compileall .
      - name: Run Backend Tests
        working-directory: backend
        run: python -m pytest -q --junitxml=backend-pytest.xml
      - name: Upload Backend Test Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-evidence
          path: backend/backend-pytest.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Build Production Backend Image
        run: docker build -t prodagentic-backend:ci ./backend
      - name: Smoke Production Backend Image
        run: |
          docker run -d --name prodagentic-backend-ci \
            -p 18000:8000 \
            -e PORT=8000 \
            -e APP_DEFAULT_LANGUAGE=es \
            -e APP_WORKSPACE_ID=ci-workspace \
            -e LANGUAGE_MIN_CONFIDENCE=0.6 \
            -e LANGUAGE_MIN_MARGIN=0.2 \
            -e IMAGE_RENDER_ENABLED=false \
            -e PRODAGENTIC_AUTH_ENABLED=false \
            -e SCHEDULER_ENABLED=false \
            prodagentic-backend:ci
          trap 'docker logs prodagentic-backend-ci || true; docker rm -f prodagentic-backend-ci || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18000/health/live; then
              exit 0
            fi
            sleep 1
          done
          echo "Production backend image never became live"
          exit 1

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit Frontend Dependency Graph
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Run Frontend Lint
        working-directory: frontend
        run: npm run lint
      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test
      - name: Verify Production API Origin Gate
        working-directory: frontend
        run: |
          if NEXT_PUBLIC_API_URL="" npm run build > /tmp/prodagentic-missing-api-build.log 2>&1; then
            cat /tmp/prodagentic-missing-api-build.log
            echo "Production build unexpectedly succeeded without NEXT_PUBLIC_API_URL"
            exit 1
          fi
          cat /tmp/prodagentic-missing-api-build.log
          grep -q "NEXT_PUBLIC_API_URL is required for production builds" /tmp/prodagentic-missing-api-build.log

          if NEXT_PUBLIC_API_URL="https://api.prodagentic.example/v1" npm run build > /tmp/prodagentic-path-api-build.log 2>&1; then
            cat /tmp/prodagentic-path-api-build.log
            echo "Production build unexpectedly accepted an API base path"
            exit 1
          fi
          cat /tmp/prodagentic-path-api-build.log
          grep -q "clean backend origin" /tmp/prodagentic-path-api-build.log

          if NEXT_PUBLIC_API_URL="/" npm run build > /tmp/prodagentic-unflagged-same-origin.log 2>&1; then
            cat /tmp/prodagentic-unflagged-same-origin.log
            echo "Production build unexpectedly accepted unflagged same-origin gateway mode"
            exit 1
          fi
          cat /tmp/prodagentic-unflagged-same-origin.log
          grep -q "PRODAGENTIC_SAME_ORIGIN_GATEWAY=true" /tmp/prodagentic-unflagged-same-origin.log
      - name: Build Frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build

  ui-browser-cert:
    name: UI-01-CERT browser
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_DEFAULT_LANGUAGE: es
      APP_WORKSPACE_ID: ui-cert-workspace
      LANGUAGE_MIN_CONFIDENCE: "0.6"
      LANGUAGE_MIN_MARGIN: "0.2"
      IMAGE_RENDER_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      PRODAGENTIC_AUTH_ENABLED: "false"
      PRODAGENTIC_COOKIE_SECURE: "false"
      PRODAGENTIC_COOKIE_SAMESITE: lax
      PRODAGENTIC_LINKEDIN_TOKEN_KEY: ui-cert-linkedin-token-key-that-is-long-enough
      LINKEDIN_CLIENT_ID: ui-cert-configured-client
      LINKEDIN_CLIENT_SECRET: ui-cert-configured-secret-no-external-call
      LINKEDIN_REDIRECT_URI: http://127.0.0.1:8000/api/integrations/linkedin/callback
      LINKEDIN_API_VERSION: "202607"
      FRONTEND_URL: http://127.0.0.1:3000
      MONGO_URI: mongodb://127.0.0.1:27017/prodagentic_ui_cert
      MONGO_TEST_URI: mongodb://127.0.0.1:27017/prodagentic_ui_cert_test
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      PRODAGENTIC_ASSET_ROOT: /tmp/prodagentic-ui-cert/assets
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      UI_CERT_BASE_URL: http://127.0.0.1:3000
      UI_CERT_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start untouched backend
        run: |
          mkdir -p /tmp/prodagentic-ui-cert/assets
          (cd backend && nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > ../ui-cert-backend.log 2>&1 & echo $! > ../ui-cert-backend.pid)
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health/live >/dev/null; then
              echo "Backend live"
              exit 0
            fi
            sleep 1
          done
          cat ui-cert-backend.log || true
          echo "UI certification backend did not become live"
          exit 1

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Start production frontend
        run: |
          (cd frontend && nohup npm start -- --hostname 127.0.0.1 --port 3000 > ../ui-cert-frontend.log 2>&1 & echo $! > ../ui-cert-frontend.pid)
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:3000 >/dev/null; then
              echo "Frontend live"
              exit 0
            fi
            sleep 1
          done
          cat ui-cert-frontend.log || true
          echo "UI certification frontend did not become live"
          exit 1

      - name: Run desktop and mobile browser certification
        working-directory: frontend
        run: npx playwright test e2e/ui-cert.spec.ts --reporter=line --workers=1

      - name: Upload UI certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-01-cert-evidence
          path: |
            frontend/ui-cert-screenshots
            frontend/test-results
            ui-cert-backend.log
            ui-cert-frontend.log
          if-no-files-found: ignore
          retention-days: 14

  docker-stack-test:
    name: DOCKER-01-CERT stack
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    env:
      SCHEDULER_ENABLED: "false"
      PRODAGENTIC_PORT: "8080"
      PRODAGENTIC_PUBLIC_ORIGIN: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - name: Create CI-only backend environment
        run: |
          cat > backend/.env <<'EOF'
          GEMINI_API_KEY=docker-ci-placeholder
          APP_DEFAULT_LANGUAGE=es
          APP_WORKSPACE_ID=docker-ci-workspace
          LANGUAGE_MIN_CONFIDENCE=0.6
          LANGUAGE_MIN_MARGIN=0.2
          IMAGE_RENDER_ENABLED=false
          PRODAGENTIC_AUTH_ENABLED=true
          PRODAGENTIC_ADMIN_USER=admin
          PRODAGENTIC_ADMIN_PASSWORD=docker-ci-password
          PRODAGENTIC_SESSION_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef
          PRODAGENTIC_LINKEDIN_TOKEN_KEY=docker-ci-linkedin-token-key-that-is-long-enough
          LINKEDIN_CLIENT_ID=docker-ci-client
          LINKEDIN_CLIENT_SECRET=docker-ci-secret-no-external-call
          LINKEDIN_API_VERSION=202607
          EOF

      - name: Validate Compose contract
        run: docker compose config --quiet

      - name: Build and start complete stack
        run: docker compose up --build -d --wait --wait-timeout 300

      - name: Verify gateway, isolation and authentication
        run: |
          curl -fsS http://127.0.0.1:8080/health/live
          curl -fsS -o /dev/null http://127.0.0.1:8080/

          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/openapi.json)" = "404"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/docs)" = "404"

          if curl --connect-timeout 1 -fsS http://127.0.0.1:8000/health/live; then
            echo "FastAPI must not be host-exposed"
            exit 1
          fi

          if timeout 1 bash -c '</dev/tcp/127.0.0.1/27017' 2>/dev/null; then
            echo "MongoDB must not be host-exposed"
            exit 1
          fi

          curl -fsS -c /tmp/prodagentic-cookies.txt \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"docker-ci-password"}' \
            http://127.0.0.1:8080/api/auth/login \
            | grep -q '"authenticated":true'

          curl -fsS -b /tmp/prodagentic-cookies.txt \
            http://127.0.0.1:8080/api/auth/session \
            | grep -q '"authenticated":true'

      - name: Verify durable Mongo and asset volumes across restart
        run: |
          docker compose exec -T mongo mongosh content_engine --quiet --eval \
            'db.reconciliation.updateOne({_id:"docker-ci"},{$set:{value:"durable"}},{upsert:true})'
          docker compose exec -T backend sh -c \
            'mkdir -p /data/prodagentic/assets && printf durable > /data/prodagentic/assets/ci-durable.txt'

          docker compose restart mongo
          docker compose up -d --wait --wait-timeout 120 mongo
          docker compose restart backend
          docker compose up -d --wait --wait-timeout 180 backend frontend gateway

          docker compose exec -T mongo mongosh content_engine --quiet --eval \
            'if (db.reconciliation.findOne({_id:"docker-ci"}).value !== "durable") quit(1)'
          test "$(curl -fsS -b /tmp/prodagentic-cookies.txt http://127.0.0.1:8080/assets/ci-durable.txt)" = "durable"

      - name: Capture stack state
        if: always()
        run: docker compose ps && docker compose logs --no-color --tail=200

      - name: Tear down stack
        if: always()
        run: docker compose down -v --remove-orphans
