name: CI

on:
  push:
    branches: [ main, feat/model-registry-router ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_DEFAULT_LANGUAGE: es
      LANGUAGE_MIN_CONFIDENCE: "0.6"
      LANGUAGE_MIN_MARGIN: "0.2"
      IMAGE_RENDER_ENABLED: "true"
      PRODAGENTIC_AUTH_ENABLED: "false"
      MONGO_URI: mongodb://127.0.0.1:27018
      MONGO_TEST_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Smoke import test
        working-directory: backend
        run: |
          python -c "import agents.router; import agents.orchestrator; import main; print('Smoke test PASSED')"
      - name: Compile check
        working-directory: backend
        run: python -m compileall .
      - name: Run Backend Tests
        working-directory: backend
        run: python -m pytest -q

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Frontend Lint
        working-directory: frontend
        run: npm run lint
      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test
      - name: Build Frontend
        working-directory: frontend
        run: npm run build
