name: CI

on:
  push:
    branches: [ main, feat/model-registry-router ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_DEFAULT_LANGUAGE: es
      LANGUAGE_MIN_CONFIDENCE: "0.6"
      LANGUAGE_MIN_MARGIN: "0.2"
      IMAGE_RENDER_ENABLED: "true"
      PRODAGENTIC_AUTH_ENABLED: "false"
      MONGO_URI: mongodb://127.0.0.1:27018
      MONGO_TEST_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Smoke import test
        working-directory: backend
        run: |
          python -c "import agents.router; import agents.orchestrator; import main; print('Smoke test PASSED')"
      - name: Compile check
        working-directory: backend
        run: python -m compileall .
      - name: Run Backend Tests
        working-directory: backend
        run: python -m pytest -q
      - name: Build Production Backend Image
        run: docker build -t prodagentic-backend:ci ./backend
      - name: Smoke Production Backend Image
        run: |
          docker run -d --name prodagentic-backend-ci \
            -p 18000:8000 \
            -e PORT=8000 \
            -e APP_DEFAULT_LANGUAGE=es \
            -e LANGUAGE_MIN_CONFIDENCE=0.6 \
            -e LANGUAGE_MIN_MARGIN=0.2 \
            -e IMAGE_RENDER_ENABLED=false \
            -e PRODAGENTIC_AUTH_ENABLED=false \
            -e SCHEDULER_ENABLED=false \
            prodagentic-backend:ci
          trap 'docker logs prodagentic-backend-ci || true; docker rm -f prodagentic-backend-ci || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18000/health/live; then
              exit 0
            fi
            sleep 1
          done
          echo "Production backend image never became live"
          exit 1

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Frontend Lint
        working-directory: frontend
        run: npm run lint
      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test
      - name: Build Frontend
        working-directory: frontend
        run: npm run build
