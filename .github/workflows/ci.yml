name: CI

on:
  push:
    branches: [ main, feat/model-registry-router ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt || pip install pytest pytest-asyncio google-genai==2.13.0 pydantic motor
      - name: Run Backend Tests
        working-directory: backend
        run: |
          python -m pytest -q
          python -m compileall .

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        working-directory: frontend
        run: npm ci || npm install
      - name: Run Frontend Lint
        working-directory: frontend
        run: npm run lint
      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test
      - name: Build Frontend
        working-directory: frontend
        run: npm run build
