name: Temporary lock refresh

on:
  push:
    branches: [ feat/release-candidate-hardening ]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/release-candidate-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate exact Next.js 16.3 lock
        working-directory: frontend
        run: npm install next@16.3.0 eslint-config-next@16.3.0 --save-exact --package-lock-only
      - name: Commit generated package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Package metadata already current"
            exit 0
          fi
          git commit -m "SEC-01: refresh Next.js 16.3.0 lockfile [skip ci]"
          git push origin HEAD:feat/release-candidate-hardening
