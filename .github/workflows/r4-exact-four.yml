name: R4 exact four-post batch

on:
  push:
    branches: [main, developer]
  pull_request:
    branches: [main, developer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-four-post-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert checked-out SHA
        shell: bash
        run: |
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: Compile strict planner
        working-directory: backend
        run: python -m compileall application/planning/strict.py routes/batches.py tests/test_r4_batch_completeness.py
      - name: Run exact-four and distinctness tests
        working-directory: backend
        run: python -m pytest -q tests/test_r4_batch_completeness.py tests/test_mk1_s2_planning.py
