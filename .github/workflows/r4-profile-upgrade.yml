name: R4 profile upgrade

on:
  push:
    branches: [developer, main]
  pull_request:
    branches: [developer, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-upgrade:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27017
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert checked-out SHA
        shell: bash
        run: |
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: Compile backend
        working-directory: backend
        run: python -m compileall .
      - name: Smoke import profile-upgrade route
        working-directory: backend
        run: python -c "import application.profiles.upgrade_service; import infrastructure.mongo.profile_upgrades; import routes.profile_upgrades; import main; print('R4 profile upgrade imports PASSED')"
      - name: Run R4 legacy Profile upgrade tests
        working-directory: backend
        run: python -m pytest -q tests/test_r4_profile_upgrade.py
