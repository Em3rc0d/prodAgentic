name: S11 Analytics Snapshots Cert

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  s11-cert:
    name: S11-CERT analytics-snapshots
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_DEFAULT_LANGUAGE: es
      LANGUAGE_MIN_CONFIDENCE: "0.6"
      LANGUAGE_MIN_MARGIN: "0.2"
      IMAGE_RENDER_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      PRODAGENTIC_AUTH_ENABLED: "false"
      PRODAGENTIC_DEPLOYMENT_KEY: s11-cert-installation
      PRODAGENTIC_ASSET_ROOT: /tmp/prodagentic-s11-assets
      MK1_ENABLED: "true"
      MK1_PROFILE_V2: "true"
      MK1_BATCH_PLANNING: "true"
      MK1_STRUCTURED_AGENT_CELL: "true"
      MK1_VISUALSPEC: "true"
      MK1_RENDER_WORKER: "true"
      MK1_REVIEW_APPROVAL: "true"
      MK1_MANUAL_EXPORT: "true"
      MK1_REDIS_TRANSPORT: "true"
      MK1_PUBLISH_WORKER: "true"
      MK1_ANALYTICS_WORKER: "true"
      MONGO_TEST_URI: mongodb://127.0.0.1:27017
      REDIS_URL: redis://127.0.0.1:6379/0
      LINKEDIN_CLIENT_ID: s11-cert-client
      LINKEDIN_CLIENT_SECRET: s11-cert-client-secret
      LINKEDIN_REDIRECT_URI: http://localhost:8000/api/integrations/linkedin/callback
      PRODAGENTIC_LINKEDIN_TOKEN_KEY: s11-cert-token-key-1234567890-abcdefghijklmnopqrstuvwxyz
      LINKEDIN_API_VERSION: "202608"
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Record exact S11 candidate identity
        run: |
          mkdir -p s11-cert-evidence
          printf 'github_sha=%s\n' "$GITHUB_SHA" > s11-cert-evidence/receipt.txt
          printf 'workflow_run_id=%s\n' "$GITHUB_RUN_ID" >> s11-cert-evidence/receipt.txt
          printf 'workflow_run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> s11-cert-evidence/receipt.txt
          printf 'linkedin_api_version=%s\n' "$LINKEDIN_API_VERSION" >> s11-cert-evidence/receipt.txt
          printf 'live_linkedin_analytics_read=NOT_EXERCISED\n' >> s11-cert-evidence/receipt.txt
          git rev-parse HEAD | sed 's/^/checkout_sha=/' >> s11-cert-evidence/receipt.txt
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            printf 'pr_head_sha=%s\n' "${{ github.event.pull_request.head.sha }}" >> s11-cert-evidence/receipt.txt
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt

      - name: Compile S11 authority surface
        working-directory: backend
        run: |
          python -m compileall \
            domain/analytics \
            application/analytics \
            infrastructure/mongo/analytics.py \
            infrastructure/mongo/analytics_jobs.py \
            infrastructure/mongo/analytics_publications.py \
            infrastructure/linkedin/analytics.py \
            infrastructure/linkedin/oauth.py \
            workers/analytics.py \
            routes/analytics_v1.py \
            main.py

      - name: Certify S11 domain Mongo provider scope and snapshot gates
        working-directory: backend
        run: |
          set -o pipefail
          python -m pytest -q tests/test_s11_analytics.py | tee ../s11-cert-evidence/backend-s11.txt

      - name: Certify dedicated analytics Redis restart reconnect
        working-directory: backend
        run: |
          python - <<'PY'
          import asyncio
          from infrastructure.redis.streams import RedisStreamsSettings, RedisStreamsTransport

          async def main():
              base = RedisStreamsSettings.from_env()
              transport = RedisStreamsTransport(RedisStreamsSettings(
                  url=base.url,
                  stream="pa:analytics:v1:restart-cert",
                  group="pa-analytics-restart-cert",
                  dead_letter_stream="pa:analytics:v1:dead:restart-cert",
              ))
              assert await transport.ping()
              await transport.ensure_group()
              await transport.close()
          asyncio.run(main())
          PY
          redis_id="$(docker ps --filter ancestor=redis:7-alpine --format '{{.ID}}' | head -n1)"
          test -n "$redis_id"
          docker restart "$redis_id"
          for attempt in $(seq 1 30); do
            if redis-cli -h 127.0.0.1 ping | grep -q PONG; then break; fi
            sleep 1
          done
          python - <<'PY'
          import asyncio
          from infrastructure.redis.streams import RedisStreamsSettings, RedisStreamsTransport

          async def main():
              base = RedisStreamsSettings.from_env()
              transport = RedisStreamsTransport(RedisStreamsSettings(
                  url=base.url,
                  stream="pa:analytics:v1:restart-cert",
                  group="pa-analytics-restart-cert",
                  dead_letter_stream="pa:analytics:v1:dead:restart-cert",
              ))
              assert await transport.ping()
              await transport.ensure_group()
              await transport.close()
              print("S11 Redis restart reconnect PASS")
          asyncio.run(main())
          PY

      - name: Prove S11 authority and secret boundaries
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              *Path("domain/analytics").glob("*.py"),
              *Path("application/analytics").glob("*.py"),
              Path("infrastructure/mongo/analytics.py"),
              Path("infrastructure/mongo/analytics_jobs.py"),
              Path("infrastructure/mongo/analytics_publications.py"),
              Path("infrastructure/linkedin/analytics.py"),
              Path("workers/analytics.py"),
              Path("routes/analytics_v1.py"),
          ]
          for path in paths:
              source = path.read_text(encoding="utf-8")
              if 'db["content_runs"]' in source:
                  raise SystemExit(f"{path}: S11 must not read MK0 content_runs authority")

          model = Path("domain/analytics/models.py").read_text(encoding="utf-8")
          repo = Path("infrastructure/mongo/analytics.py").read_text(encoding="utf-8")
          adapter = Path("infrastructure/linkedin/analytics.py").read_text(encoding="utf-8")
          worker = Path("workers/analytics.py").read_text(encoding="utf-8")
          route = Path("routes/analytics_v1.py").read_text(encoding="utf-8")
          main = Path("main.py").read_text(encoding="utf-8")

          for marker in ("snapshot_digest", "raw_digest", "unavailable_metrics", "freshness"):
              if marker not in model:
                  raise SystemExit(f"S11 evidence model missing {marker}")
          if "update_one" in repo or "delete_one" in repo or "replace_one" in repo:
              raise SystemExit("MetricSnapshot repository must remain append-only")
          for marker in ("r_member_postAnalytics", "memberCreatorPostAnalytics", "MEMBERS_REACHED", "Linkedin-Version"):
              if marker not in adapter:
                  raise SystemExit(f"LinkedIn analytics contract marker missing: {marker}")
          if "pa:analytics:v1" not in worker or "MongoAnalyticsJobOutboxRepository" not in worker:
              raise SystemExit("S11 dedicated analytics stream/outbox specialization missing")
          if "MK1_ANALYTICS_WORKER" not in main:
              raise SystemExit("S11 runtime feature gate missing")
          if "encrypted_access_token" in route:
              raise SystemExit("S11 API route must not expose token fields")
          print("S11 boundary PASS: PUBLISHED receipt -> read-only provider -> append-only MetricSnapshot")
          PY

      - name: Validate S11 compose overlay
        run: |
          docker compose -f docker-compose.yml -f docker-compose.s9.yml -f docker-compose.s10.yml -f docker-compose.s11.yml config > s11-cert-evidence/compose-s11.txt
          grep -q 'redis:' s11-cert-evidence/compose-s11.txt
          grep -q 'MK1_ANALYTICS_WORKER:' s11-cert-evidence/compose-s11.txt
          grep -q 'pa:analytics:v1' s11-cert-evidence/compose-s11.txt

      - name: Set up Node and Chromium for Analytics UX
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build and start S11 Analytics UI
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_MK1_SHELL: "true"
          NEXT_PUBLIC_MK1_PROFILE_V2: "true"
          NEXT_PUBLIC_MK1_BATCH_PLANNING: "true"
          NEXT_PUBLIC_MK1_MANUAL_EXPORT: "true"
          NEXT_PUBLIC_MK1_PUBLISHING: "true"
          NEXT_PUBLIC_MK1_ANALYTICS: "true"
        run: |
          npm run build
          nohup npm start -- --hostname 127.0.0.1 --port 3000 > ../s11-cert-evidence/frontend.log 2>&1 &
          echo $! > ../s11-cert-evidence/frontend.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/analytics > /dev/null; then exit 0; fi
            sleep 2
          done
          cat ../s11-cert-evidence/frontend.log || true
          exit 1

      - name: Certify Analytics desktop mobile unavailable and freshness UX
        working-directory: frontend
        run: |
          set -o pipefail
          npx playwright test e2e/s11-analytics.spec.ts --reporter=line | tee ../s11-cert-evidence/browser-s11.txt

      - name: Verify tracked checkout remained clean
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      - name: Record S11 source inventory
        if: always()
        run: |
          git status --short > s11-cert-evidence/git-status.txt
          git ls-files \
            backend/domain/analytics \
            backend/application/analytics \
            backend/infrastructure/mongo/analytics.py \
            backend/infrastructure/mongo/analytics_jobs.py \
            backend/infrastructure/mongo/analytics_publications.py \
            backend/infrastructure/linkedin/analytics.py \
            backend/infrastructure/linkedin/oauth.py \
            backend/workers/analytics.py \
            backend/routes/analytics_v1.py \
            backend/tests/test_s11_analytics.py \
            frontend/app/analytics \
            frontend/lib/analytics.ts \
            frontend/e2e/s11-analytics.spec.ts \
            docker-compose.s11.yml \
            .github/workflows/s11-cert.yml \
            mk1/build/slices/S11 \
            > s11-cert-evidence/s11-files.txt

      - name: Upload S11 certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s11-analytics-snapshots-evidence
          path: s11-cert-evidence
          if-no-files-found: error
          retention-days: 30
