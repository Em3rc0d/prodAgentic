name: Docker Compose Local

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: docker-compose-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: DOCKER-COMPOSE-LOCAL smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Validate WSL launcher syntax
        run: bash -n scripts/docker-wsl-up.sh

      - name: Validate WSL NAT Compose model
        env:
          PRODAGENTIC_WEB_BIND_HOST: 172.30.10.20
          NEXT_PUBLIC_API_URL: http://172.30.10.20:8000
          PRODAGENTIC_ALLOW_PRIVATE_HTTP_API: "true"
          CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://172.30.10.20:3000
          FRONTEND_URL: http://172.30.10.20:3000
        run: docker compose config --quiet

      - name: Reject private HTTP API without explicit local opt-in
        env:
          NEXT_PUBLIC_API_URL: http://172.30.10.20:8000
          PRODAGENTIC_ALLOW_PRIVATE_HTTP_API: "false"
        run: |
          if docker compose build frontend > /tmp/private-http-rejected.log 2>&1; then
            cat /tmp/private-http-rejected.log
            echo "Frontend build unexpectedly accepted RFC1918 HTTP without explicit opt-in"
            exit 1
          fi
          cat /tmp/private-http-rejected.log
          grep -q "RFC1918 HTTP is allowed only when PRODAGENTIC_ALLOW_PRIVATE_HTTP_API=true" /tmp/private-http-rejected.log

      - name: Build explicit WSL private HTTP frontend candidate
        env:
          NEXT_PUBLIC_API_URL: http://172.30.10.20:8000
          PRODAGENTIC_ALLOW_PRIVATE_HTTP_API: "true"
        run: docker compose build frontend

      - name: Build local stack
        run: docker compose build

      - name: Start local stack and wait for health
        run: docker compose up -d --wait --wait-timeout 240

      - name: Show service state
        run: docker compose ps

      - name: Verify Mongo
        run: |
          docker compose exec -T mongo mongosh --quiet --eval \
            'if (db.runCommand({ ping: 1 }).ok !== 1) { quit(2) }'

      - name: Verify backend liveness
        run: curl --fail --silent --show-error http://127.0.0.1:8000/health/live

      - name: Verify frontend HTTP
        run: curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null

      - name: Verify default local auth boundary
        shell: bash
        run: |
          login_json="$(curl --fail --silent --show-error \
            -X POST http://127.0.0.1:8000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"local-docker-password-change-me"}')"
          LOGIN_JSON="$login_json" python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["LOGIN_JSON"])
          assert payload.get("authenticated") is True, payload
          assert payload.get("csrf_token"), payload
          print("Local auth smoke PASSED")
          PY

      - name: Capture Compose logs
        if: always()
        run: docker compose logs --no-color > docker-compose-local.log || true

      - name: Upload Compose evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-local-evidence
          path: |
            docker-compose-local.log
            /tmp/private-http-rejected.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Destroy CI stack
        if: always()
        run: docker compose down -v --remove-orphans
