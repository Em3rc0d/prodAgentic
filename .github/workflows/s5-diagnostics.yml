name: S5 Diagnostics

on:
  pull_request:
    branches: [ main ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_DEFAULT_LANGUAGE: es
      LANGUAGE_MIN_CONFIDENCE: "0.6"
      LANGUAGE_MIN_MARGIN: "0.2"
      IMAGE_RENDER_ENABLED: "true"
      PRODAGENTIC_AUTH_ENABLED: "false"
      PRODAGENTIC_DEPLOYMENT_KEY: ui-cert-installation
      MK1_ENABLED: "true"
      MK1_PROFILE_V2: "true"
      MK1_BATCH_PLANNING: "true"
      MONGO_URI: mongodb://127.0.0.1:27018
      MONGO_TEST_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Capture exact backend pytest failure
        working-directory: backend
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
          set +e
          python -m pytest -q 2>&1 | tee ../backend-full.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > ../backend-pytest-exit-code.txt
          exit 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Produce audited lockfile candidate without weakening policy
        working-directory: frontend
        run: |
          npm ci
          set +e
          npm audit --audit-level=high > ../frontend-audit-before.txt 2>&1
          printf '%s\n' "$?" > ../frontend-audit-before-exit-code.txt
          set -e
          cp package-lock.json ../package-lock.before.json
          npm audit fix --package-lock-only
          npm audit --audit-level=high > ../frontend-audit-after.txt 2>&1
          cp package-lock.json ../package-lock.candidate.json
          git diff -- package-lock.json > ../frontend-package-lock.diff

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s5-diagnostics
          path: |
            backend-full.log
            backend-pytest-exit-code.txt
            frontend-audit-before.txt
            frontend-audit-before-exit-code.txt
            frontend-audit-after.txt
            package-lock.before.json
            package-lock.candidate.json
            frontend-package-lock.diff
          if-no-files-found: warn
          retention-days: 7
