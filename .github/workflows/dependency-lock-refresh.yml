name: Temporary dependency lock refresh

on:
  push:
    branches: [ feat/release-candidate-hardening ]

permissions:
  contents: write

jobs:
  refresh-locks:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/release-candidate-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Add the browser certification tool to the repository lock
        working-directory: frontend
        run: npm install @playwright/test@1.55.0 --save-dev --save-exact --package-lock-only
      - name: Compile hashed Python 3.11 production lock
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-tools==7.6.1
          python -m piptools compile --generate-hashes --resolver=backtracking --output-file=backend/requirements.lock backend/requirements.txt
      - name: Commit generated dependency locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json backend/requirements.lock
          if git diff --cached --quiet; then
            echo "Dependency locks already current"
            exit 0
          fi
          git commit -m "SEC-02: lock browser and backend production dependencies [skip ci]"
          git push origin HEAD:feat/release-candidate-hardening
