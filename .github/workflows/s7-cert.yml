name: S7 Review + Approval V2 Cert

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  s7-cert:
    name: S7-CERT review-approval-v2
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_DEFAULT_LANGUAGE: es
      LANGUAGE_MIN_CONFIDENCE: "0.6"
      LANGUAGE_MIN_MARGIN: "0.2"
      IMAGE_RENDER_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      PRODAGENTIC_AUTH_ENABLED: "false"
      PRODAGENTIC_DEPLOYMENT_KEY: s7-cert-installation
      PRODAGENTIC_ASSET_ROOT: /tmp/prodagentic-s7-assets
      MK1_ENABLED: "true"
      MK1_PROFILE_V2: "true"
      MK1_BATCH_PLANNING: "true"
      MK1_STRUCTURED_AGENT_CELL: "true"
      MK1_VISUALSPEC: "true"
      MK1_RENDER_WORKER: "true"
      MK1_REVIEW_APPROVAL: "true"
      MONGO_URI: mongodb://127.0.0.1:27017/prodagentic_s7_cert
      MONGO_TEST_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Record exact S7 candidate identity
        run: |
          mkdir -p s7-cert-evidence
          printf 'github_sha=%s\n' "$GITHUB_SHA" > s7-cert-evidence/receipt.txt
          printf 'workflow_run_id=%s\n' "$GITHUB_RUN_ID" >> s7-cert-evidence/receipt.txt
          printf 'workflow_run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> s7-cert-evidence/receipt.txt
          git rev-parse HEAD | sed 's/^/checkout_sha=/' >> s7-cert-evidence/receipt.txt
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            printf 'pr_head_sha=%s\n' "${{ github.event.pull_request.head.sha }}" >> s7-cert-evidence/receipt.txt
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt

      - name: Compile S7 authority surface
        working-directory: backend
        run: |
          python -m compileall domain/approval application/approval infrastructure/mongo/approval.py routes/approval.py

      - name: Certify exact review digest byte rehash and immutable approval
        working-directory: backend
        run: |
          set -o pipefail
          python -m pytest -q tests/test_s7_approval_authority.py | tee ../s7-cert-evidence/authority-gate.txt

      - name: Certify real Mongo restart concurrency tenant and CAS behavior
        working-directory: backend
        run: |
          set -o pipefail
          python -m pytest -q tests/test_mk1_s7_approval_mongo.py | tee ../s7-cert-evidence/mongo-gate.txt

      - name: Prove S7 stops before export scheduling and publication authority
        working-directory: backend
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          paths = [
              *Path("domain/approval").glob("*.py"),
              *Path("application/approval").glob("*.py"),
              Path("infrastructure/mongo/approval.py"),
              Path("routes/approval.py"),
          ]
          forbidden_calls = {"publish", "schedule", "export", "dispatch", "enqueue"}
          violations = []
          for path in paths:
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Call):
                      name = node.func.id if isinstance(node.func, ast.Name) else node.func.attr if isinstance(node.func, ast.Attribute) else ""
                      if name.lower() in forbidden_calls:
                          violations.append(f"{path}: downstream authority call {name}()")
              source = path.read_text(encoding="utf-8")
              if "PublicationReceipt" in source or "Schedule(" in source:
                  violations.append(f"{path}: downstream domain authority reference")
          if violations:
              raise SystemExit("S7 crossed S8+ authority boundary:\n" + "\n".join(violations))
          print("S7 boundary PASS: authority ends at immutable human ApprovalBundleV2")
          PY

      - name: Set up Node and Chromium for Review decision gate
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build and start Review UI
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_MK1_SHELL: "true"
          NEXT_PUBLIC_MK1_PROFILE_V2: "true"
          NEXT_PUBLIC_MK1_BATCH_PLANNING: "true"
        run: |
          npm run build
          nohup npm start -- --hostname 127.0.0.1 --port 3000 > ../s7-cert-evidence/frontend.log 2>&1 &
          echo $! > ../s7-cert-evidence/frontend.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat ../s7-cert-evidence/frontend.log || true
          exit 1

      - name: Certify progressive Review approve and edit UX
        working-directory: frontend
        run: |
          set -o pipefail
          npx playwright test e2e/s7-review-approval.spec.ts --reporter=line | tee ../s7-cert-evidence/review-gate.txt

      - name: Verify tracked checkout remained clean
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      - name: Record S7 source inventory
        if: always()
        run: |
          git status --short > s7-cert-evidence/git-status.txt
          git ls-files \
            backend/domain/approval \
            backend/application/approval \
            backend/infrastructure/mongo/approval.py \
            backend/routes/approval.py \
            backend/tests/test_s7_approval_authority.py \
            backend/tests/test_mk1_s7_approval_mongo.py \
            frontend/app/review \
            frontend/lib/approval.ts \
            frontend/e2e/s7-review-approval.spec.ts \
            .github/workflows/s7-cert.yml \
            > s7-cert-evidence/s7-files.txt

      - name: Upload S7 certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s7-review-approval-v2-evidence
          path: s7-cert-evidence
          if-no-files-found: error
          retention-days: 30
