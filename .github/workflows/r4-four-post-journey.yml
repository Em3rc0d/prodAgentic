name: R4 four-post horizontal journey

on:
  push:
    branches: [main, developer]
  pull_request:
    branches: [main, developer]
  workflow_dispatch:

concurrency:
  group: r4-four-post-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  four-post-horizontal-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRODAGENTIC_AUTH_ENABLED: "false"
      PRODAGENTIC_DEMO_MODE: "true"
      PRODAGENTIC_ALLOW_PRIVATE_HTTP_API: "false"
      R4_WEB_URL: http://127.0.0.1:3000
      R4_API_URL: http://127.0.0.1:8000
      R4_STATE_FILE: r4-four-post-state.json

    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert checked-out SHA
        shell: bash
        run: |
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p r4-four-post-evidence
          echo "$ACTUAL" > r4-four-post-evidence/checkout-sha.txt
      - name: Start isolated stack
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Prove truthful demo readiness
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready | tee r4-four-post-evidence/readiness.json
          python - <<'PY'
          import json
          payload=json.load(open('r4-four-post-evidence/readiness.json'))
          assert payload['status']=='READY_DEMO', payload
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser certification dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Produce exactly four posts through Review and approval
        working-directory: frontend
        run: npx playwright test e2e/r4-four-post-journey.spec.ts --grep "creates exactly four" --reporter=line
      - name: Preserve journey state and persistence evidence
        run: |
          cp frontend/r4-four-post-state.json r4-four-post-evidence/
          cp frontend/r4-four-post-approved.png r4-four-post-evidence/ 2>/dev/null || true
          docker compose exec -T mongo mongosh --quiet prodagentic_local --eval '
            const revisions=db.content_revisions.find({status:"REVIEWABLE"},{_id:0,revision_id:1,content_id:1,status:1,asset_refs:1,qa_report_id:1}).toArray();
            const approvals=db.approvals.find({},{_id:0,approval_id:1,revision_id:1,bundle_sha256:1}).toArray();
            print(JSON.stringify({revision_count:revisions.length,approval_count:approvals.length,revisions,approvals}));
          ' | tee r4-four-post-evidence/persistence-before-restart.json
          python - <<'PY'
          import json
          payload=json.load(open('r4-four-post-evidence/persistence-before-restart.json'))
          assert payload['revision_count']==4, payload
          assert payload['approval_count']==4, payload
          assert all(row.get('asset_refs') for row in payload['revisions']), payload
          PY
      - name: Restart backend over persisted Mongo and owned assets
        run: |
          docker compose restart backend
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready | grep -q READY_DEMO; then exit 0; fi
            sleep 2
          done
          docker compose logs backend
          exit 1
      - name: Certify all four approvals and visual pages survive restart
        working-directory: frontend
        run: npx playwright test e2e/r4-four-post-journey.spec.ts --grep "all four approvals" --reporter=line
      - name: Capture post-restart evidence
        run: |
          cp frontend/r4-four-post-after-restart.png r4-four-post-evidence/ 2>/dev/null || true
          docker compose exec -T mongo mongosh --quiet prodagentic_local --eval '
            print(JSON.stringify({
              revisions:db.content_revisions.countDocuments({status:"REVIEWABLE"}),
              approvals:db.approvals.countDocuments({})
            }));
          ' | tee r4-four-post-evidence/persistence-after-restart.json
      - name: Verify tracked checkout remained clean
        run: |
          rm -f frontend/r4-four-post-state.json frontend/r4-four-post-approved.png frontend/r4-four-post-after-restart.png
          git diff --exit-code
          git diff --cached --exit-code
      - name: Capture stack logs
        if: always()
        run: docker compose logs --no-color > r4-four-post-evidence/compose.log || true
      - name: Upload R4 four-post evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-four-post-horizontal-evidence
          path: r4-four-post-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Destroy isolated stack
        if: always()
        run: docker compose down -v --remove-orphans
