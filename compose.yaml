name: prodagentic

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - prodagentic_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-content_engine}
      APP_WORKSPACE_ID: ${APP_WORKSPACE_ID:-legacy-default}
      PRODAGENTIC_COOKIE_SECURE: ${PRODAGENTIC_COOKIE_SECURE:-false}
      PRODAGENTIC_COOKIE_SAMESITE: ${PRODAGENTIC_COOKIE_SAMESITE:-lax}
      CORS_ALLOWED_ORIGINS: http://localhost:${PRODAGENTIC_PORT:-8080}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
    expose:
      - "8000"
    volumes:
      - render_assets:/app/static/assets/renders
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - prodagentic_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - prodagentic_internal

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PRODAGENTIC_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - prodagentic_internal

volumes:
  mongo_data:
  render_assets:

networks:
  prodagentic_internal:
    driver: bridge
