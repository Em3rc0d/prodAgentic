name: prodagentic

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - prodagentic_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  renderer:
    build:
      context: .
      dockerfile: renderer/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      PORT: "4100"
    expose:
      - "4100"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      PRODAGENTIC_ENV: development
      APP_DEFAULT_LANGUAGE: ${APP_DEFAULT_LANGUAGE:-es}
      LANGUAGE_MIN_CONFIDENCE: ${LANGUAGE_MIN_CONFIDENCE:-0.6}
      LANGUAGE_MIN_MARGIN: ${LANGUAGE_MIN_MARGIN:-0.2}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      MONGO_URI: mongodb://mongo:27017/prodagentic_local
      MONGO_DB: prodagentic_local
      PRODAGENTIC_ASSET_ROOT: /app/assets
      PRODAGENTIC_DEPLOYMENT_KEY: ${PRODAGENTIC_DEPLOYMENT_KEY:-local-docker-installation}
      PRODAGENTIC_RENDERER_URL: http://renderer:4100
      PRODAGENTIC_RENDERER_TIMEOUT_SECONDS: ${PRODAGENTIC_RENDERER_TIMEOUT_SECONDS:-30}

      MK1_ENABLED: "true"
      MK1_PROFILE_V2: "true"
      MK1_BATCH_PLANNING: "true"
      MK1_STRUCTURED_AGENT_CELL: "true"
      MK1_VISUALSPEC: "true"
      MK1_RENDER_WORKER: "true"
      IMAGE_RENDER_ENABLED: "false"
      SCHEDULER_ENABLED: "false"

      PRODAGENTIC_AUTH_ENABLED: ${PRODAGENTIC_AUTH_ENABLED:-true}
      PRODAGENTIC_ADMIN_USER: ${PRODAGENTIC_ADMIN_USER:-admin}
      PRODAGENTIC_ADMIN_PASSWORD: ${PRODAGENTIC_ADMIN_PASSWORD:-local-docker-password-change-me}
      PRODAGENTIC_SESSION_SECRET: ${PRODAGENTIC_SESSION_SECRET:-local-docker-session-secret-change-me-0123456789abcdef}
      PRODAGENTIC_SESSION_TTL_SECONDS: ${PRODAGENTIC_SESSION_TTL_SECONDS:-43200}
      PRODAGENTIC_COOKIE_SECURE: "false"
      PRODAGENTIC_COOKIE_SAMESITE: lax

      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"

      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_REDIRECT_URI: "${LINKEDIN_REDIRECT_URI:-http://127.0.0.1:8000/api/integrations/linkedin/callback}"
      PRODAGENTIC_LINKEDIN_TOKEN_KEY: ${PRODAGENTIC_LINKEDIN_TOKEN_KEY:-}
      LINKEDIN_API_VERSION: ${LINKEDIN_API_VERSION:-202608}
      LINKEDIN_STATIC_FALLBACK_ENABLED: "false"

      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_ALLOW_DIRECT_FALLBACK: "false"
    ports:
      - "${PRODAGENTIC_WEB_BIND_HOST:-127.0.0.1}:8000:8000"
    volumes:
      - prodagentic_assets:/app/assets
    depends_on:
      mongo:
        condition: service_healthy
      renderer:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}"
        NEXT_PUBLIC_MK1_SHELL: "true"
        NEXT_PUBLIC_MK1_PROFILE_V2: "true"
        NEXT_PUBLIC_MK1_BATCH_PLANNING: "true"
        PRODAGENTIC_ALLOW_PRIVATE_HTTP_API: "${PRODAGENTIC_ALLOW_PRIVATE_HTTP_API:-false}"
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "${PRODAGENTIC_WEB_BIND_HOST:-127.0.0.1}:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  prodagentic_mongo_data:
  prodagentic_assets:
